name: Build FairRx APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create the Android part (keep our own files)
        run: |
          cp pubspec.yaml /tmp/pubspec.yaml
          cp -r lib /tmp/lib_ours
          flutter create . --platforms=android --project-name fairrx
          cp /tmp/pubspec.yaml pubspec.yaml
          rm -rf lib test
          cp -r /tmp/lib_ours lib
          ls -R lib assets

      - name: Set minSdk to 23 and add camera permission
        run: |
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' android/app/build.gradle* || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' android/app/build.gradle* || true
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.CAMERA"/>' android/app/src/main/AndroidManifest.xml

      - name: Turn on R8 shrinking with ML Kit rules (smaller APK)
        run: |
          cat > android/app/proguard-rules.pro <<'RULES'
          -dontwarn com.google.mlkit.vision.text.chinese.**
          -dontwarn com.google.mlkit.vision.text.devanagari.**
          -dontwarn com.google.mlkit.vision.text.japanese.**
          -dontwarn com.google.mlkit.vision.text.korean.**
          RULES
          sed -i 's/^          //' android/app/proguard-rules.pro
          sed -i 's/signingConfig = signingConfigs.getByName("debug")/&\n            isMinifyEnabled = true\n            isShrinkResources = true\n            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")/' android/app/build.gradle.kts || true
          sed -i 's/signingConfig signingConfigs.debug/&\n            minifyEnabled true\n            shrinkResources true\n            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"/' android/app/build.gradle || true
          cat android/app/proguard-rules.pro
          grep -n -A8 "release {" android/app/build.gradle* || true

      - run: flutter pub get

      - name: App icon and app name
        run: |
          dart run flutter_launcher_icons || true
          sed -i 's/android:label="[^"]*"/android:label="FairRx"/' android/app/src/main/AndroidManifest.xml
          grep -n 'android:label' android/app/src/main/AndroidManifest.xml || true

      - name: Analyze (errors are shown as annotations)
        run: |
          flutter analyze > analyze.log 2>&1 || true
          M=$(grep -E " error " analyze.log | head -12 | cut -c1-230 | sed ':a;N;$!ba;s/\n/%0A/g')
          if [ -n "$M" ]; then echo "::error title=ANALYZE::$M"; fi

      - name: Build release APK
        run: |
          flutter build apk --release --split-per-abi > build.log 2>&1 && exit 0
          M=$(grep -v -E "^\[|Unzipping|Downloading|Installing" build.log | grep -A12 -E "went wrong|Error:|error:" | head -30 | cut -c1-250 | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=BUILD::$M"
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: fairrx-apk
          path: build/app/outputs/flutter-apk/*-release.apk
