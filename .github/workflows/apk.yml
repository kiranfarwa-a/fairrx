name: Build FairRx APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create the Android part (keep our own files)
        run: |
          cp pubspec.yaml /tmp/pubspec.yaml
          cp -r lib /tmp/lib_ours
          flutter create . --platforms=android --project-name fairrx
          cp /tmp/pubspec.yaml pubspec.yaml
          rm -rf lib test
          cp -r /tmp/lib_ours lib
          ls -R lib assets

      - name: Set minSdk to 23 and add camera permission
        run: |
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' android/app/build.gradle* || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' android/app/build.gradle* || true
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.CAMERA"/>' android/app/src/main/AndroidManifest.xml

      - name: Turn OFF R8 shrinking (keeps ML Kit text reading safe)
        run: |
          sed -i 's/signingConfig = signingConfigs.getByName("debug")/&\n            isMinifyEnabled = false\n            isShrinkResources = false/' android/app/build.gradle.kts || true
          sed -i 's/signingConfig signingConfigs.debug/&\n            minifyEnabled false\n            shrinkResources false/' android/app/build.gradle || true
          printf 'minifyEnabled=false\n' >> android/gradle.properties
          grep -n -A6 "release {" android/app/build.gradle* || true

      - name: Notification setup (desugaring, permissions, receivers)
        run: |
          sed -i 's/compileOptions {/compileOptions {\n        isCoreLibraryDesugaringEnabled = true/' android/app/build.gradle.kts || true
          printf '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")\n}\n' >> android/app/build.gradle.kts
          M=android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\n    <uses-permission android:name="android.permission.VIBRATE"/>\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>' $M
          sed -i 's#</application>#    <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />\n        <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">\n            <intent-filter>\n                <action android:name="android.intent.action.BOOT_COMPLETED"/>\n                <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>\n            </intent-filter>\n        </receiver>\n    </application>#' $M
          cat $M | head -30

      - run: flutter pub get

      - name: App icon and app name
        run: |
          dart run flutter_launcher_icons || true
          sed -i 's/android:label="[^"]*"/android:label="FairRx"/' android/app/src/main/AndroidManifest.xml
          grep -n 'android:label' android/app/src/main/AndroidManifest.xml || true

      - name: Analyze (errors are shown as annotations)
        run: |
          flutter analyze > analyze.log 2>&1 || true
          M=$(grep -E " error " analyze.log | head -12 | cut -c1-230 | sed ':a;N;$!ba;s/\n/%0A/g')
          if [ -n "$M" ]; then echo "::error title=ANALYZE::$M"; fi

      - name: Build release APK
        run: |
          flutter build apk --release --target-platform android-arm64 > build.log 2>&1 && exit 0
          M=$(grep -v -E "^\[|Unzipping|Downloading|Installing" build.log | grep -A12 -E "went wrong|Error:|error:" | head -30 | cut -c1-250 | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=BUILD::$M"
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: fairrx-apk
          path: build/app/outputs/flutter-apk/*-release.apk
